[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sphncs"
version = "0.1.0"
description = "Syntactical pseudo-hierarchical normal clustering for strings"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "KDEpy>=1.1",
    "FastMapy>=0.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["sphncs*"]
